# This is a basic workflow from GitHub to help you get started with Actions
# It is needed so that we have at least one check to require so that we can enable
# the "Require branches to be up to date before merging" setting.

# Add this file to your repository as `.github/workflows/ci.yml`

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend unit tests
        working-directory: backend
        run: npm run test:unit

      # Only the services the backend uses: Postgres (always started), Auth (gotrue),
      # PostgREST (for supabaseAdmin.from(...)) and Kong (the API gateway in front of them).
      # Applies the migrations in backend/supabase/migrations on startup.
      - name: Start local Supabase
        working-directory: backend
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run backend integration tests
        working-directory: backend
        run: npm run test:integration
